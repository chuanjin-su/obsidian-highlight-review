name: Publish 0.2.0 beta

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-beta.yml]
  workflow_dispatch:

env:
  RELEASE_TAG: "0.2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: publish-0.2.0-beta
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build and test
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code -- main.js
      - name: Verify the release version
        run: |
          node -e 'const assert = require("node:assert/strict"); assert.equal(require("./manifest.json").version, process.env.RELEASE_TAG)'
      - name: Publish the beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json url --jq .url; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" main.js manifest.json styles.css \
            --verify-tag --prerelease --latest=false --title "$RELEASE_TAG" --notes-from-tag
