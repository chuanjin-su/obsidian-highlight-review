name: Publish 1.0.0 beta

on:
  push:
    tags: ["1.0.0"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build and test
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code -- main.js
      - name: Verify the release version
        run: |
          node -e 'const assert = require("node:assert/strict"); assert.equal(require("./manifest.json").version, process.env.GITHUB_REF_NAME)'
      - name: Publish the beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --verify-tag --prerelease --latest=false --title "$GITHUB_REF_NAME" --notes-from-tag
